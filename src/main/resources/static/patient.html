<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="css/patient.css">
</head>

<body>

    <nav>
        <div id="company-logo">
            <span id="Smart">Smart </span>Care
        </div>
        <input type="text" placeholder="Search..." id="search-bar">

        <div id="nav-icons">

            <div class="notifi-container">
                <img src="/media/bell.png" alt="alert" class="icons">
                <span class="notifi">2</span>
            </div>

            <div class="notifi-container">
                <img src="/media/email.png" alt="mail" class="icons">
                <span class="notifi">2</span>
            </div>

            <img src="/media/user.png" alt="user" id="user-login">
        </div>

    </nav>

    <main>

        <div id="side-bar" style="grid-area: side-bar;">

            <div id="dassbar-cart"></div>
            <div id="Today-apointment"></div>
            <div id="Apointment-request"></div>
            <div id="Patient-visit"></div>
            <div id="Notification"></div>

        </div>

        <div id="header-bar" style="grid-area: header-bar;">

            <div class="header-container">

                <div id="title-container">
                    <span id="title-bar"></span>
                    <span class="title">Patients</span>
                </div>
                
                <button class="add-button">+ Add patient</button>

            </div>

            <div class="search-container">
                <input type="text" placeholder="Search..." class="search-icon">

                <select name="blood-group" id="blood-group" class="options">
                    <option value="blood-group">Blood Group</option>
                    <option value="a">A</option>
                    <option value="a+">A+</option>
                    <option value="a">A</option>
                    <option value="a">A</option>
                    <option value="a">A</option>
                    <option value="a">A</option>
                    <option value="a">A</option>
                </select>

                <select name="gender" id="gender" class="options">
                    <option value="gender">gender</option>
                    <option value="male">Male</option>
                    <option value="female">Female</option>
                </select>
            </div>
        </div>

        <div id="table-view" style="grid-area: table-view;">
            <table id="patient-table">
                <thead>
                <tr>
                    <th>Patient ID</th>
                    <th>Name</th>
                    <th>Gender</th>
                    <th>Blood Group</th>
                    <th>Phone</th>
                    <th>Actions</th>
                </tr>
                </thead>

                <tbody id="patient-table-body">
                <!-- JavaScript will add patients here -->
                </tbody>
            </table>
        </div>

    </main>

<script src = "js/script.js"></script>


</body>

</html>
