<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title><!DOCTYPE html>
      <html lang="en">

      <head>

      <meta charset="UTF-8">

      <meta name="viewport" content="width=device-width, initial-scale=1.0">

      <title>SmartCare - Sign Up</title>

  <link rel="stylesheet" href="css/singup.css">

</head>


<body>


<div class="page-container">


  <!-- LEFT -->

  <div class="welcome-section">

    <div class="logo">

      <span>Smart</span>Care

    </div>


    <div class="welcome-content">

      <h1>Create Account</h1>

      <p>
        Create your SmartCare account and
        start using the Hospital Management System.
      </p>

    </div>

  </div>



  <!-- RIGHT -->

  <div class="form-section">

    <div class="form-container">


      <h2>Sign Up</h2>

      <p class="subtitle">
        Create a new SmartCare account
      </p>


      <form id="signup-form">


        <!-- USERNAME -->

        <div class="input-group">

          <label for="userName">
            Username
          </label>

          <input
                  type="text"
                  id="userName"
                  placeholder="Enter username"
          >

          <small
                  class="error"
                  id="username-error">
          </small>

        </div>



        <!-- PASSWORD -->

        <div class="input-group">

          <label for="password">
            Password
          </label>

          <div class="password-container">

            <input
                    type="password"
                    id="password"
                    placeholder="Enter password"
            >

            <button
                    type="button"
                    id="toggle-password"
                    class="show-password">
              Show
            </button>

          </div>

          <small
                  class="error"
                  id="password-error">
          </small>

        </div>



        <!-- CONFIRM PASSWORD -->

        <div class="input-group">

          <label for="confirmPassword">
            Confirm Password
          </label>

          <input
                  type="password"
                  id="confirmPassword"
                  placeholder="Confirm password"
          >

          <small
                  class="error"
                  id="confirm-password-error">
          </small>

        </div>



        <button
                type="submit"
                id="signup-button"
                class="main-button">

          Sign Up

        </button>


      </form>



      <div id="popup-message"></div>



      <p class="switch-page">

        Already have an account?

        <a href="login.html">
          Login
        </a>

      </p>


    </div>

  </div>

</div>


<script src="js/singup.js"></script>

</body>

</html></title>
</head>
<body>

</body>
</html>
